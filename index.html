<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MathGrapher - インタラクティブ関数グラフ学習ツール</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      user-select: none;
      touch-action: manipulation;
    }
    .math-font {
      font-family: 'Fira Code', 'Cambria Math', 'Times New Roman', serif;
    }
    /* スライダースタイル */
    input[type=range] {
      -webkit-appearance: none;
      background: #334155;
      height: 6px;
      border-radius: 9999px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #2563eb;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    canvas {
      cursor: grab;
      touch-action: none;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden">

  <!-- ヘッダー -->
  <header class="bg-slate-950/90 backdrop-blur border-b border-slate-800 px-3 py-2 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-2 sm:gap-3">
      <a href="../" class="inline-flex items-center gap-1 text-xs font-semibold text-slate-400 hover:text-slate-100 transition py-1 px-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700/80">
        <i class="fa-solid fa-arrow-left text-[10px]"></i>
        <span class="hidden sm:inline">Apps Hub</span>
      </a>

      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white flex items-center justify-center shadow-lg shadow-blue-500/20 text-sm">
        <i class="fa-solid fa-chart-line"></i>
      </div>
      <div>
        <h1 class="text-sm sm:text-base font-extrabold tracking-tight text-white flex items-center gap-1.5">
          MathGrapher
        </h1>
      </div>
    </div>

    <!-- 右側：スマホ用 表示切替スイッチ (グラフ ⇄ パネル) & ビュー操作 -->
    <div class="flex items-center gap-1.5">
      <!-- スマホ縦画面専用：表示モード切り替えトグル -->
      <div class="flex md:hidden bg-slate-800 p-0.5 rounded-lg border border-slate-700 text-xs font-bold">
        <button id="mobile-toggle-graph" onclick="setMobileView('graph')" class="px-2.5 py-1 rounded bg-blue-600 text-white transition">
          <i class="fa-solid fa-chart-line mr-1"></i>グラフ
        </button>
        <button id="mobile-toggle-panel" onclick="setMobileView('panel')" class="px-2.5 py-1 rounded text-slate-400 transition">
          <i class="fa-solid fa-sliders mr-1"></i>操作
        </button>
      </div>

      <button onclick="resetView()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg border border-slate-700 transition flex items-center gap-1" title="原点に戻す">
        <i class="fa-solid fa-arrows-to-dot text-blue-400"></i> <span class="hidden sm:inline">原点に戻す</span>
      </button>
      <div class="hidden sm:flex items-center bg-slate-800/80 border border-slate-700 rounded-lg p-0.5 text-xs">
        <button onclick="zoomBtn(1.2)" class="px-2 py-1 hover:bg-slate-700 rounded text-slate-200" title="ズームイン">
          <i class="fa-solid fa-magnifying-glass-plus"></i>
        </button>
        <button onclick="zoomBtn(0.833)" class="px-2 py-1 hover:bg-slate-700 rounded text-slate-200" title="ズームアウト">
          <i class="fa-solid fa-magnifying-glass-minus"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ (PC/横画面は左右2分割、スマホ縦画面はタブ切替) -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

    <!-- 左側: 操作パネル & 数学情報 -->
    <aside id="main-panel" class="w-full md:w-[380px] lg:w-[420px] bg-slate-900 border-r border-slate-800 flex flex-col overflow-y-auto shrink-0 z-10 hidden md:flex h-full">
      
      <!-- 関数種別タブ -->
      <div class="p-2.5 bg-slate-950/60 border-b border-slate-800 sticky top-0 z-20 backdrop-blur">
        <div class="grid grid-cols-4 gap-1 p-1 bg-slate-900 rounded-xl border border-slate-800 text-xs font-bold">
          <button id="tab-linear" onclick="switchFunction('linear')" class="py-1.5 rounded-lg transition-all text-center">一次</button>
          <button id="tab-quadratic" onclick="switchFunction('quadratic')" class="py-1.5 rounded-lg transition-all text-center">二次</button>
          <button id="tab-cubic" onclick="switchFunction('cubic')" class="py-1.5 rounded-lg transition-all text-center">三次</button>
          <button id="tab-trig" onclick="switchFunction('trig')" class="py-1.5 rounded-lg transition-all text-center">三角</button>
        </div>

        <!-- 三角関数の副サブタブ -->
        <div id="trig-subtabs" class="grid grid-cols-3 gap-1 mt-1.5 p-0.5 bg-slate-900 rounded-lg border border-slate-800/70 text-xs hidden">
          <button id="subtab-sin" onclick="switchTrigType('sin')" class="py-1 rounded text-center font-bold">sin(x)</button>
          <button id="subtab-cos" onclick="switchTrigType('cos')" class="py-1 rounded text-center font-bold">cos(x)</button>
          <button id="subtab-tan" onclick="switchTrigType('tan')" class="py-1 rounded text-center font-bold">tan(x)</button>
        </div>
      </div>

      <!-- 数式カード -->
      <div class="p-3 border-b border-slate-800 bg-gradient-to-b from-slate-950 to-slate-900">
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 flex items-center justify-between">
          <span>現在の関数方程式</span>
          <span id="formula-badge" class="px-2 py-0.5 rounded text-[10px] bg-blue-500/20 text-blue-300 border border-blue-500/30">y = ax + b</span>
        </div>
        <div id="formula-display" class="math-font text-lg sm:text-xl font-bold text-blue-400 py-1 px-2.5 bg-slate-950 rounded-lg border border-slate-800/80 shadow-inner overflow-x-auto whitespace-nowrap">
          y = 1.0x + 0.0
        </div>
      </div>

      <!-- スライダーコントロール領域 -->
      <div class="p-3 space-y-3 flex-1">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
            <i class="fa-solid fa-sliders text-blue-500"></i> 係数パラメータ
          </h2>
          <button onclick="resetParams()" class="text-[11px] text-blue-400 hover:text-blue-300 font-semibold transition">
            <i class="fa-solid fa-rotate-left mr-1"></i>初期値
          </button>
        </div>

        <div id="sliders-container" class="space-y-2.5">
          <!-- JSで動的にパラメータスライダーを生成 -->
        </div>

        <!-- 特徴点・分析カード -->
        <div class="pt-2">
          <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
            <i class="fa-solid fa-bullseye text-emerald-400"></i> 数学的特徴点
          </h3>
          <div id="properties-container" class="grid grid-cols-2 gap-2 text-xs"></div>
        </div>

        <!-- 要点解説 -->
        <div id="explanation-box" class="p-2.5 bg-slate-950/70 rounded-xl border border-slate-800/90 text-xs text-slate-300 leading-relaxed"></div>
      </div>

    </aside>

    <!-- 右側: インタラクティブ Canvas 描画エリア -->
    <main id="main-graph" class="flex-1 relative bg-slate-950 overflow-hidden flex items-center justify-center h-full w-full">
      <canvas id="mathCanvas" class="w-full h-full block"></canvas>
      
      <!-- 凡例オーバーレイ -->
      <div class="absolute top-3 right-3 bg-slate-900/85 backdrop-blur-md border border-slate-700/80 rounded-xl p-2.5 shadow-xl pointer-events-none text-xs space-y-1">
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-1 rounded bg-blue-500 inline-block"></span>
          <span class="font-semibold text-slate-200"><span id="legend-func-name" class="text-blue-400">f(x)</span></span>
        </div>
        <div id="legend-points" class="space-y-0.5 pt-1 border-t border-slate-800 text-[10px]">
          <div class="flex items-center gap-1.5 text-emerald-400">
            <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span>
            <span>切片 / 解</span>
          </div>
          <div id="legend-special" class="flex items-center gap-1.5 text-amber-400">
            <span class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span>
            <span>頂点 / 極値 / 変曲点</span>
          </div>
        </div>
      </div>

      <!-- スマホ用スライダーフロートミニボタン（グラフ画面から直接パラメータ変更したいとき用） -->
      <button onclick="setMobileView('panel')" class="md:hidden absolute bottom-3 right-3 bg-blue-600/90 hover:bg-blue-600 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-lg border border-blue-400/30 flex items-center gap-1.5 backdrop-blur">
        <i class="fa-solid fa-sliders"></i> 係数変更
      </button>
    </main>

  </div>

  <!-- 常時固定フッター -->
  <footer class="bg-slate-950 border-t border-slate-800 px-3 py-1.5 shrink-0 z-30 flex items-center justify-between text-[10px] text-slate-400">
    <div class="truncate max-w-[70%]">
      <span class="text-amber-500 font-bold">⚠️</span> 個人開発プロトタイプ（完全ローカル動作・自己責任）
    </div>
    <div id="coords-status" class="math-font text-slate-400 shrink-0 font-semibold text-[11px]">
      X: 0.00, Y: 0.00
    </div>
  </footer>

  <script>
    // --- 状態管理 ---
    let currentType = 'linear';
    let trigType = 'sin';
    let mobileView = 'graph'; // 'graph' or 'panel'

    const params = {
      linear: { a: 1.0, b: 0.0 },
      quadratic: { a: 1.0, b: 0.0, c: -2.0 },
      cubic: { a: 1.0, b: 0.0, c: -3.0, d: 0.0 },
      trig: { a: 1.0, b: 1.0, c: 0.0, d: 0.0 }
    };

    let originX = 0;
    let originY = 0;
    let scale = 40;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    const canvas = document.getElementById('mathCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('main-graph');

    // スマホ縦画面での表示切替（グラフ ⇄ パネル）
    function setMobileView(view) {
      mobileView = view;
      const panel = document.getElementById('main-panel');
      const graph = document.getElementById('main-graph');
      const btnGraph = document.getElementById('mobile-toggle-graph');
      const btnPanel = document.getElementById('mobile-toggle-panel');

      if (window.innerWidth < 768) {
        if (view === 'graph') {
          panel.classList.add('hidden');
          panel.classList.remove('flex');
          graph.classList.remove('hidden');
          graph.classList.add('flex');
          btnGraph.className = 'px-2.5 py-1 rounded bg-blue-600 text-white transition';
          btnPanel.className = 'px-2.5 py-1 rounded text-slate-400 transition';
          setTimeout(() => resizeCanvas(), 30);
        } else {
          graph.classList.add('hidden');
          graph.classList.remove('flex');
          panel.classList.remove('hidden');
          panel.classList.add('flex');
          btnPanel.className = 'px-2.5 py-1 rounded bg-blue-600 text-white transition';
          btnGraph.className = 'px-2.5 py-1 rounded text-slate-400 transition';
        }
      }
    }

    const paramDefs = {
      linear: [
        { key: 'a', label: '傾き (a)', min: -5, max: 5, step: 0.1, desc: '変化の割合' },
        { key: 'b', label: 'y切片 (b)', min: -10, max: 10, step: 0.1, desc: 'y軸との交点' }
      ],
      quadratic: [
        { key: 'a', label: '開き具合 (a)', min: -5, max: 5, step: 0.1, desc: '正で下凸、負で上凸' },
        { key: 'b', label: 'xの係数 (b)', min: -10, max: 10, step: 0.2, desc: '軸の横移動' },
        { key: 'c', label: 'y切片 (c)', min: -10, max: 10, step: 0.2, desc: 'y軸との交点' }
      ],
      cubic: [
        { key: 'a', label: '3次の係数 (a)', min: -3, max: 3, step: 0.1, desc: '全体のうねり' },
        { key: 'b', label: '2次の係数 (b)', min: -5, max: 5, step: 0.1, desc: '変曲点の横位置' },
        { key: 'c', label: '1次の係数 (c)', min: -10, max: 10, step: 0.2, desc: '極値の有無' },
        { key: 'd', label: '定数項 (d)', min: -10, max: 10, step: 0.2, desc: '上下の平行移動' }
      ],
      trig: [
        { key: 'a', label: '振幅 (a)', min: -5, max: 5, step: 0.1, desc: '縦の伸縮率' },
        { key: 'b', label: '周波数 (b)', min: 0.2, max: 5, step: 0.1, desc: '周期 T = 2π/b' },
        { key: 'c', label: '位相シフト (c)', min: -6.28, max: 6.28, step: 0.1, desc: '横のズレ' },
        { key: 'd', label: '上下移動 (d)', min: -5, max: 5, step: 0.1, desc: '基準線の上下シフト' }
      ]
    };

    function switchFunction(type) {
      currentType = type;
      ['linear', 'quadratic', 'cubic', 'trig'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === type) {
          btn.className = "py-1.5 rounded-lg transition-all text-center bg-blue-600 text-white shadow-md shadow-blue-500/20";
        } else {
          btn.className = "py-1.5 rounded-lg transition-all text-center text-slate-400 hover:text-slate-200 hover:bg-slate-800/60";
        }
      });

      const trigSub = document.getElementById('trig-subtabs');
      if (type === 'trig') {
        trigSub.classList.remove('hidden');
        updateTrigSubtabs();
      } else {
        trigSub.classList.add('hidden');
      }

      buildSliders();
      updateAll();
    }

    function switchTrigType(sub) {
      trigType = sub;
      updateTrigSubtabs();
      updateAll();
    }

    function updateTrigSubtabs() {
      ['sin', 'cos', 'tan'].forEach(st => {
        const btn = document.getElementById(`subtab-${st}`);
        if (st === trigType) {
          btn.className = "py-1 rounded text-center font-bold bg-blue-500/30 text-blue-300 border border-blue-500/40";
        } else {
          btn.className = "py-1 rounded text-center font-bold text-slate-400 hover:text-slate-200";
        }
      });
    }

    function buildSliders() {
      const containerEl = document.getElementById('sliders-container');
      containerEl.innerHTML = '';
      const defs = paramDefs[currentType];
      const cur = params[currentType];

      defs.forEach(def => {
        const val = cur[def.key];
        const row = document.createElement('div');
        row.className = "p-2.5 bg-slate-950/60 rounded-xl border border-slate-800/80 space-y-1.5";
        row.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-200">${def.label}</span>
            <input type="number" id="num-${def.key}" step="${def.step}" value="${val.toFixed(1)}" 
              class="w-16 px-1.5 py-0.5 text-right font-mono font-bold text-xs bg-slate-900 border border-slate-700 rounded text-blue-400 focus:outline-none focus:border-blue-500"
              onchange="onNumberInput('${def.key}', this.value)"
            >
          </div>
          <div class="flex items-center gap-2">
            <span class="text-[9px] text-slate-500 font-mono w-5">${def.min}</span>
            <input type="range" id="range-${def.key}" min="${def.min}" max="${def.max}" step="${def.step}" value="${val}"
              class="w-full cursor-pointer accent-blue-600"
              oninput="onSliderInput('${def.key}', this.value)"
            >
            <span class="text-[9px] text-slate-500 font-mono w-5 text-right">${def.max}</span>
          </div>
        `;
        containerEl.appendChild(row);
      });
    }

    function onSliderInput(key, val) {
      const num = parseFloat(val);
      params[currentType][key] = num;
      const numInput = document.getElementById(`num-${key}`);
      if (numInput) numInput.value = num.toFixed(1);
      updateAll();
    }

    function onNumberInput(key, val) {
      let num = parseFloat(val);
      if (isNaN(num)) num = 0;
      params[currentType][key] = num;
      const rangeInput = document.getElementById(`range-${key}`);
      if (rangeInput) rangeInput.value = num;
      updateAll();
    }

    function resetParams() {
      if (currentType === 'linear') params.linear = { a: 1.0, b: 0.0 };
      else if (currentType === 'quadratic') params.quadratic = { a: 1.0, b: 0.0, c: -2.0 };
      else if (currentType === 'cubic') params.cubic = { a: 1.0, b: 0.0, c: -3.0, d: 0.0 };
      else if (currentType === 'trig') params.trig = { a: 1.0, b: 1.0, c: 0.0, d: 0.0 };
      buildSliders();
      updateAll();
    }

    function f(x) {
      if (currentType === 'linear') {
        return params.linear.a * x + params.linear.b;
      } else if (currentType === 'quadratic') {
        const { a, b, c } = params.quadratic;
        return a * x * x + b * x + c;
      } else if (currentType === 'cubic') {
        const { a, b, c, d } = params.cubic;
        return a * Math.pow(x, 3) + b * Math.pow(x, 2) + c * x + d;
      } else if (currentType === 'trig') {
        const { a, b, c, d } = params.trig;
        const arg = b * x + c;
        if (trigType === 'sin') return a * Math.sin(arg) + d;
        if (trigType === 'cos') return a * Math.cos(arg) + d;
        if (trigType === 'tan') return a * Math.tan(arg) + d;
      }
      return 0;
    }

    function updateFormulaDisplay() {
      const disp = document.getElementById('formula-display');
      const badge = document.getElementById('formula-badge');
      const legFunc = document.getElementById('legend-func-name');

      if (currentType === 'linear') {
        const { a, b } = params.linear;
        badge.innerText = "一次関数 y = ax + b";
        legFunc.innerText = "y = ax + b";
        let signB = b >= 0 ? `+ ${b.toFixed(1)}` : `- ${Math.abs(b).toFixed(1)}`;
        disp.innerHTML = `y = <span class="text-white">${a.toFixed(1)}</span>x ${signB}`;
      } else if (currentType === 'quadratic') {
        const { a, b, c } = params.quadratic;
        badge.innerText = "二次関数 y = ax² + bx + c";
        legFunc.innerText = "y = ax² + bx + c";
        let signB = b >= 0 ? `+ ${b.toFixed(1)}x` : `- ${Math.abs(b).toFixed(1)}x`;
        let signC = c >= 0 ? `+ ${c.toFixed(1)}` : `- ${Math.abs(c).toFixed(1)}`;
        disp.innerHTML = `y = <span class="text-white">${a.toFixed(1)}</span>x² ${signB} ${signC}`;
      } else if (currentType === 'cubic') {
        const { a, b, c, d } = params.cubic;
        badge.innerText = "三次関数 y = ax³ + bx² + cx + d";
        legFunc.innerText = "y = ax³ + ...";
        let signB = b >= 0 ? `+ ${b.toFixed(1)}x²` : `- ${Math.abs(b).toFixed(1)}x²`;
        let signC = c >= 0 ? `+ ${c.toFixed(1)}x` : `- ${Math.abs(c).toFixed(1)}x`;
        let signD = d >= 0 ? `+ ${d.toFixed(1)}` : `- ${Math.abs(d).toFixed(1)}`;
        disp.innerHTML = `y = <span class="text-white">${a.toFixed(1)}</span>x³ ${signB} ${signC} ${signD}`;
      } else if (currentType === 'trig') {
        const { a, b, c, d } = params.trig;
        badge.innerText = `三角関数 y = a·${trigType}(bx + c) + d`;
        legFunc.innerText = `y = a·${trigType}(...)`;
        let signC = c >= 0 ? `+ ${c.toFixed(1)}` : `- ${Math.abs(c).toFixed(1)}`;
        let signD = d >= 0 ? `+ ${d.toFixed(1)}` : `- ${Math.abs(d).toFixed(1)}`;
        disp.innerHTML = `y = <span class="text-white">${a.toFixed(1)}</span>·${trigType}(<span class="text-white">${b.toFixed(1)}</span>x ${signC}) ${signD}`;
      }
    }

    function computeKeyFeatures() {
      const items = [];
      let explanation = "";
      const highlightPoints = [];
      const highlightLines = [];

      if (currentType === 'linear') {
        const { a, b } = params.linear;
        items.push({ label: '傾き (m)', val: a.toFixed(2), desc: '変化の割合' });
        items.push({ label: 'y切片 (0, b)', val: `(0, ${b.toFixed(2)})`, desc: 'y軸交点' });
        highlightPoints.push({ x: 0, y: b, label: `y切片 (0, ${b.toFixed(1)})`, color: '#34d399' });

        if (Math.abs(a) > 0.0001) {
          const rootX = -b / a;
          items.push({ label: 'x切片 (零点)', val: `(${rootX.toFixed(2)}, 0)`, desc: 'ax+b=0の解' });
          highlightPoints.push({ x: rootX, y: 0, label: `零点 (${rootX.toFixed(1)}, 0)`, color: '#34d399' });
        } else {
          items.push({ label: 'x切片', val: (b === 0 ? '無数' : 'なし'), desc: '水平線' });
        }
        explanation = a > 0 ? `右上がりの直線です（単調増加）。傾きaが大きいほど急になります。` : (a < 0 ? `右下がりの直線です（単調減少）。切片bで全体が上下に移動します。` : `傾き0の水平線です。`);

      } else if (currentType === 'quadratic') {
        const { a, b, c } = params.quadratic;
        if (Math.abs(a) >= 0.0001) {
          const vx = -b / (2 * a);
          const vy = c - (b * b) / (4 * a);
          items.push({ label: '頂点座標', val: `(${vx.toFixed(2)}, ${vy.toFixed(2)})`, desc: '放物線の頂点' });
          items.push({ label: '対称軸', val: `x = ${vx.toFixed(2)}`, desc: '対称の軸' });
          highlightPoints.push({ x: vx, y: vy, label: `頂点 (${vx.toFixed(1)}, ${vy.toFixed(1)})`, color: '#fbbf24' });
          highlightLines.push({ type: 'v', val: vx, color: 'rgba(251, 191, 36, 0.4)' });

          const D = b * b - 4 * a * c;
          if (D > 0.001) {
            const x1 = (-b + Math.sqrt(D)) / (2 * a);
            const x2 = (-b - Math.sqrt(D)) / (2 * a);
            items.push({ label: '実数解 (x切片)', val: `${Math.min(x1,x2).toFixed(1)}, ${Math.max(x1,x2).toFixed(1)}`, desc: '2実数解' });
            highlightPoints.push({ x: x1, y: 0, label: `${x1.toFixed(1)}`, color: '#34d399' });
            highlightPoints.push({ x: x2, y: 0, label: `${x2.toFixed(1)}`, color: '#34d399' });
          } else if (Math.abs(D) <= 0.001) {
            items.push({ label: '実数解', val: `重解 ${vx.toFixed(1)}`, desc: 'x軸と接する' });
            highlightPoints.push({ x: vx, y: 0, label: `重解 ${vx.toFixed(1)}`, color: '#34d399' });
          } else {
            items.push({ label: '実数解', val: 'なし (虚数解)', desc: 'D < 0' });
          }
          items.push({ label: '判別式 D', val: `D = ${D.toFixed(1)}`, desc: '解の判別' });
          highlightPoints.push({ x: 0, y: c, label: `y切片 (0, ${c.toFixed(1)})`, color: '#34d399' });
          explanation = a > 0 ? `下に凸の放物線です。頂点で最小値をとり、判別式Dでx軸との交点の個数が決まります。` : `上に凸の放物線です。頂点で最大値をとります。`;
        }
      } else if (currentType === 'cubic') {
        const { a, b, c, d } = params.cubic;
        if (Math.abs(a) >= 0.0001) {
          const infX = -b / (3 * a);
          const infY = f(infX);
          items.push({ label: '変曲点', val: `(${infX.toFixed(1)}, ${infY.toFixed(1)})`, desc: '点対称の中心' });
          highlightPoints.push({ x: infX, y: infY, label: `変曲点 (${infX.toFixed(1)}, ${infY.toFixed(1)})`, color: '#ec4899' });

          const D1 = b * b - 3 * a * c;
          if (D1 > 0.0001) {
            const x1 = (-b - Math.sqrt(D1)) / (3 * a);
            const x2 = (-b + Math.sqrt(D1)) / (3 * a);
            let maxP = a > 0 ? { x: x1, y: f(x1) } : { x: x2, y: f(x2) };
            let minP = a > 0 ? { x: x2, y: f(x2) } : { x: x1, y: f(x1) };
            items.push({ label: '極大値', val: `(${maxP.x.toFixed(1)}, ${maxP.y.toFixed(1)})`, desc: '山' });
            items.push({ label: '極小値', val: `(${minP.x.toFixed(1)}, ${minP.y.toFixed(1)})`, desc: '谷' });
            highlightPoints.push({ x: maxP.x, y: maxP.y, label: `極大 (${maxP.x.toFixed(1)}, ${maxP.y.toFixed(1)})`, color: '#fbbf24' });
            highlightPoints.push({ x: minP.x, y: minP.y, label: `極小 (${minP.x.toFixed(1)}, ${minP.y.toFixed(1)})`, color: '#fbbf24' });
            explanation = `極大値と極小値の双方が存在します。グラフ全体は変曲点に関して点対称です。`;
          } else {
            items.push({ label: '極値', val: 'なし', desc: '単調増加/減少' });
            explanation = `極大・極小を持たずに常に一定方向に推移するS字曲線になります。`;
          }
          highlightPoints.push({ x: 0, y: d, label: `y切片 (0, ${d.toFixed(1)})`, color: '#34d399' });
        }
      } else if (currentType === 'trig') {
        const { a, b, c, d } = params.trig;
        if (trigType === 'tan') {
          const period = Math.PI / Math.abs(b);
          items.push({ label: '周期 T', val: `${period.toFixed(2)}`, desc: 'π/|b|' });
          items.push({ label: '中心線', val: `y = ${d.toFixed(1)}`, desc: '基準' });
          const viewLeftX = toMathX(0);
          const viewRightX = toMathX(canvas.width);
          const kStart = Math.floor((b * viewLeftX + c - Math.PI / 2) / Math.PI) - 1;
          const kEnd = Math.ceil((b * viewRightX + c - Math.PI / 2) / Math.PI) + 1;
          for (let k = kStart; k <= kEnd; k++) {
            const asymX = (Math.PI / 2 + k * Math.PI - c) / b;
            highlightLines.push({ type: 'v', val: asymX, color: 'rgba(239, 68, 68, 0.6)', dashed: true });
          }
          explanation = `周期は π/|b| です。赤色の漸近線に近づくにつれて正負の無限大へ発散します。`;
        } else {
          const period = (2 * Math.PI) / Math.abs(b);
          const maxVal = d + Math.abs(a);
          const minVal = d - Math.abs(a);
          items.push({ label: '周期 T', val: `${period.toFixed(2)}`, desc: '2π/|b|' });
          items.push({ label: '振幅 |a|', val: `${Math.abs(a).toFixed(1)}`, desc: '振れ幅' });
          items.push({ label: '最大値', val: `${maxVal.toFixed(1)}`, desc: '最大値' });
          items.push({ label: '最小値', val: `${minVal.toFixed(1)}`, desc: '最小値' });
          highlightLines.push({ type: 'h', val: maxVal, color: 'rgba(52, 211, 153, 0.25)', dashed: true });
          highlightLines.push({ type: 'h', val: minVal, color: 'rgba(52, 211, 153, 0.25)', dashed: true });
          highlightLines.push({ type: 'h', val: d, color: 'rgba(148, 163, 184, 0.25)', dashed: true });
          explanation = `${trigType.toUpperCase()}波形です。aで縦幅、bで周期(2π/b)、cで左右位相、dで上下に移動します。`;
        }
      }

      const propBox = document.getElementById('properties-container');
      propBox.innerHTML = items.map(it => `
        <div class="p-2 bg-slate-950/80 rounded-lg border border-slate-800 flex flex-col justify-between">
          <span class="text-[9px] font-bold text-slate-400">${it.label}</span>
          <span class="math-font text-xs font-bold text-emerald-400 truncate">${it.val}</span>
        </div>
      `).join('');

      document.getElementById('explanation-box').innerText = explanation;
      return { highlightPoints, highlightLines };
    }

    // --- Canvas 描画エンジン ---
    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
      
      if (originX === 0 && originY === 0) {
        originX = rect.width / 2;
        originY = rect.height / 2;
      }
      draw();
    }

    function toScreenX(x) { return originX + x * scale; }
    function toScreenY(y) { return originY - y * scale; }
    function toMathX(px) { return (px - originX) / scale; }
    function toMathY(py) { return (originY - py) / scale; }

    function draw() {
      const width = canvas.width / (window.devicePixelRatio || 1);
      const height = canvas.height / (window.devicePixelRatio || 1);

      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, width, height);

      const minPixelGrid = 45;
      const rawStep = minPixelGrid / scale;
      const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
      const residual = rawStep / mag;
      let gridStep = mag;
      if (residual > 5) gridStep = 10 * mag;
      else if (residual > 2) gridStep = 5 * mag;
      else if (residual > 1) gridStep = 2 * mag;

      // 1. グリッド
      ctx.lineWidth = 1;
      ctx.strokeStyle = "#1e293b";
      ctx.beginPath();
      const startX = Math.floor(toMathX(0) / gridStep) * gridStep;
      const endX = Math.ceil(toMathX(width) / gridStep) * gridStep;
      for (let x = startX; x <= endX; x += gridStep) {
        const px = toScreenX(x);
        ctx.moveTo(px, 0); ctx.lineTo(px, height);
      }
      const startY = Math.floor(toMathY(height) / gridStep) * gridStep;
      const endY = Math.ceil(toMathY(0) / gridStep) * gridStep;
      for (let y = startY; y <= endY; y += gridStep) {
        const py = toScreenY(y);
        ctx.moveTo(0, py); ctx.lineTo(width, py);
      }
      ctx.stroke();

      // 2. 主軸
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#475569";
      ctx.beginPath();
      ctx.moveTo(0, originY); ctx.lineTo(width, originY);
      ctx.moveTo(originX, 0); ctx.lineTo(originX, height);
      ctx.stroke();

      // 3. 目盛り
      ctx.fillStyle = "#64748b";
      ctx.font = "10px 'Fira Code', monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      for (let x = startX; x <= endX; x += gridStep) {
        if (Math.abs(x) < 0.0001) continue;
        const px = toScreenX(x);
        const yPos = Math.min(Math.max(originY + 4, 18), height - 16);
        ctx.fillText(Number(x.toFixed(2)).toString(), px, yPos);
      }
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (let y = startY; y <= endY; y += gridStep) {
        if (Math.abs(y) < 0.0001) continue;
        const py = toScreenY(y);
        const xPos = Math.min(Math.max(originX - 6, 24), width - 6);
        ctx.fillText(Number(y.toFixed(2)).toString(), xPos, py);
      }

      const { highlightPoints, highlightLines } = computeKeyFeatures();

      // 4. 特徴補助線
      highlightLines.forEach(line => {
        ctx.save();
        ctx.strokeStyle = line.color;
        ctx.lineWidth = 1.5;
        if (line.dashed) ctx.setLineDash([4, 4]);
        ctx.beginPath();
        if (line.type === 'v') {
          const px = toScreenX(line.val);
          ctx.moveTo(px, 0); ctx.lineTo(px, height);
        } else if (line.type === 'h') {
          const py = toScreenY(line.val);
          ctx.moveTo(0, py); ctx.lineTo(width, py);
        }
        ctx.stroke();
        ctx.restore();
      });

      // 5. 曲線描画
      ctx.save();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#3b82f6";
      ctx.shadowColor = "rgba(59, 130, 246, 0.4)";
      ctx.shadowBlur = 8;
      ctx.beginPath();
      let isDrawingLine = false;
      const stepPixels = 1.5;

      for (let px = 0; px <= width; px += stepPixels) {
        const mx = toMathX(px);
        const my = f(mx);
        if (isNaN(my) || !isFinite(my) || Math.abs(my) > 1000) {
          isDrawingLine = false;
          continue;
        }
        const py = toScreenY(my);
        if (!isDrawingLine) {
          ctx.moveTo(px, py);
          isDrawingLine = true;
        } else {
          ctx.lineTo(px, py);
        }
      }
      ctx.stroke();
      ctx.restore();

      // 6. 特徴点プロット
      highlightPoints.forEach(pt => {
        const px = toScreenX(pt.x);
        const py = toScreenY(pt.y);
        if (px < -20 || px > width + 20 || py < -20 || py > height + 20) return;

        ctx.save();
        ctx.beginPath();
        ctx.arc(px, py, 5, 0, Math.PI * 2);
        ctx.fillStyle = pt.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#020617";
        ctx.stroke();

        ctx.font = "bold 10px 'Plus Jakarta Sans', sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        const labelText = pt.label;
        const textWidth = ctx.measureText(labelText).width;
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.fillRect(px + 7, py - 10, textWidth + 6, 20);
        ctx.strokeStyle = pt.color;
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 7, py - 10, textWidth + 6, 20);
        ctx.fillStyle = "#f8fafc";
        ctx.fillText(labelText, px + 10, py);
        ctx.restore();
      });
    }

    function updateAll() {
      updateFormulaDisplay();
      draw();
    }

    function resetView() {
      const rect = container.getBoundingClientRect();
      originX = rect.width / 2;
      originY = rect.height / 2;
      scale = 40;
      draw();
    }

    function zoomBtn(factor) {
      const rect = container.getBoundingClientRect();
      zoomAt(rect.width / 2, rect.height / 2, factor);
    }

    function zoomAt(screenX, screenY, factor) {
      const mathX = toMathX(screenX);
      const mathY = toMathY(screenY);
      scale = Math.max(5, Math.min(600, scale * factor));
      originX = screenX - mathX * scale;
      originY = screenY + mathY * scale;
      draw();
    }

    // マウスドラッグ
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX - rect.left;
      const clientY = e.clientY - rect.top;

      if (isDragging) {
        originX += (e.clientX - dragStartX);
        originY += (e.clientY - dragStartY);
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        draw();
      }

      if (clientX >= 0 && clientX <= rect.width && clientY >= 0 && clientY <= rect.height) {
        const mx = toMathX(clientX);
        const my = toMathY(clientY);
        document.getElementById('coords-status').innerText = `X: ${mx.toFixed(2)}, Y: ${my.toFixed(2)}`;
      }
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.15 : 0.87);
    }, { passive: false });

    // スマホ タッチ操作（1本指ドラッグ、2本指ピンチズーム）
    let touchStartDist = 0;
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        touchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && isDragging) {
        originX += (e.touches[0].clientX - dragStartX);
        originY += (e.touches[0].clientY - dragStartY);
        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;
        draw();
      } else if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (touchStartDist > 0) {
          const factor = dist / touchStartDist;
          const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          const rect = canvas.getBoundingClientRect();
          zoomAt(midX - rect.left, midY - rect.top, factor);
        }
        touchStartDist = dist;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
      isDragging = false;
      touchStartDist = 0;
    });

    window.addEventListener('resize', () => {
      // 画面回転時やリサイズ時に再計算
      if (window.innerWidth >= 768) {
        document.getElementById('main-panel').classList.remove('hidden');
        document.getElementById('main-panel').classList.add('flex');
        document.getElementById('main-graph').classList.remove('hidden');
        document.getElementById('main-graph').classList.add('flex');
      } else {
        setMobileView(mobileView);
      }
      resizeCanvas();
    });

    window.addEventListener('DOMContentLoaded', () => {
      switchFunction('linear');
      if (window.innerWidth < 768) {
        setMobileView('graph'); // スマホ縦画面の初期状態はグラフ全画面
      }
      resizeCanvas();
    });
  </script>
</body>
</html>
